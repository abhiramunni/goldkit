<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoldKit — Buy Gold Smart</title>
<meta name="description" content="Today's gold rate, a jewellery bill calculator, your gold stash value, hallmark know-how and honest buying guides — all on your device.">
<meta name="theme-color" content="#2b1d12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#faf5ec; --paper2:#f3ead9; --card:#fffdf7; --ink:#2b1d12; --ink2:#6b563e; --ink3:#9a8567;
  --gold:#a67c00; --bronze:#b07d2b; --goldsoft:#e8c96a; --terra:#b4552d; --terra2:#8f3d1f;
  --line:#e3d5bd; --line2:#d9c8a8; --good:#2e7d32; --bad:#b3261e; --amberbg:#fdf3d7;
  --shadow:0 10px 30px rgba(43,29,18,.10); --shadow2:0 4px 14px rgba(43,29,18,.08);
  --r:18px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,-apple-system,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,.serif{font-family:'Fraunces',Georgia,serif;line-height:1.12}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:1rem;color:var(--ink)}
a{color:var(--terra)}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.eyebrow{font-size:.72rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--bronze)}
.muted{color:var(--ink2)}
.small{font-size:.85rem}
.num{font-variant-numeric:tabular-nums}
.inr{font-weight:700}
/* ---------- cinematic intro ---------- */
#intro{position:fixed;inset:0;z-index:200;background:radial-gradient(120% 120% at 50% 0%,#3a2a16 0%,#241a0e 55%,#171006 100%);color:#f7ead0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;transition:opacity .6s ease,visibility .6s}
#intro.hide{opacity:0;visibility:hidden;pointer-events:none}
#intro .coin{width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a8,#e8c96a 45%,#a67c00 80%,#7a5c00);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 6px rgba(232,201,106,.18),0 0 60px rgba(232,201,106,.45);animation:coinspin 2.6s ease-in-out infinite}
#intro .coin svg{width:52px;height:52px}
@keyframes coinspin{0%,100%{transform:rotateY(0deg) scale(1)}50%{transform:rotateY(180deg) scale(1.06)}}
#intro h1{font-size:clamp(2.6rem,9vw,4.4rem);font-weight:700;margin:26px 0 8px;letter-spacing:.01em}
#intro h1 span{display:inline-block;opacity:0;animation:rise .7s ease forwards}
#intro h1 span:nth-child(1){animation-delay:.15s}#intro h1 span:nth-child(2){animation-delay:.25s}
#intro h1 span:nth-child(3){animation-delay:.35s}#intro h1 span:nth-child(4){animation-delay:.45s}
#intro h1 span:nth-child(5){animation-delay:.55s}#intro h1 span:nth-child(6){animation-delay:.65s}
#intro h1 span:nth-child(7){animation-delay:.75s}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
#intro p{opacity:0;animation:fadein .8s ease .9s forwards;color:#e8d9b8;font-size:1.05rem;max-width:420px}
@keyframes fadein{to{opacity:1}}
#introBarWrap{width:min(300px,80vw);height:4px;background:rgba(247,234,208,.22);border-radius:99px;margin-top:30px;overflow:hidden}
#introBar{height:100%;width:0%;background:linear-gradient(90deg,#e8c96a,#c98f2e);border-radius:99px;transition:width .2s linear}
#introSkip{margin-top:22px;background:transparent;border:1px solid rgba(247,234,208,.45);color:#f7ead0;padding:9px 20px;border-radius:99px;font-size:.9rem;font-weight:600}
#introSkip:hover{background:rgba(247,234,208,.12)}
/* ---------- header ---------- */
header.site{position:sticky;top:0;z-index:60;background:rgba(250,245,236,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.site-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 20px;max-width:1080px;margin:0 auto}
.logo{display:flex;align-items:center;gap:10px;font-family:'Fraunces',serif;font-weight:700;font-size:1.35rem;letter-spacing:.01em}
.logo .mark{width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a8,#e8c96a 45%,#a67c00);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(166,124,0,.4)}
.logo .mark svg{width:20px;height:20px}
.hdr-right{display:flex;align-items:center;gap:10px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:.82rem;font-weight:600;color:var(--ink2)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--good);animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(46,125,50,.35)}55%{box-shadow:0 0 0 6px rgba(46,125,50,0)}}
/* ---------- ticker ---------- */
.ticker{background:var(--ink);color:#f3e6c8;overflow:hidden;white-space:nowrap;border-bottom:3px solid var(--bronze)}
.ticker-track{display:inline-block;padding:9px 0;font-size:.86rem;font-weight:600;letter-spacing:.02em;animation:tick 38s linear infinite}
.ticker-track b{color:var(--goldsoft)}
.ticker-track span{margin:0 18px}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
/* ---------- hero ---------- */
.hero{position:relative}
.hero-photo{height:340px;overflow:hidden;position:relative}
.hero-photo img{width:100%;height:100%;object-fit:cover;animation:kenburns 26s ease-in-out infinite alternate;filter:saturate(1.05)}
@keyframes kenburns{from{transform:scale(1) translate(0,0)}to{transform:scale(1.12) translate(-1.5%,1.5%)}}
.hero-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(43,29,18,.05) 40%,rgba(43,29,18,.55))}
.hero-copy{position:absolute;left:0;right:0;bottom:0;padding:0 20px 26px;max-width:1080px;margin:0 auto;color:#fff8ea}
.hero-copy h1{font-size:clamp(2.1rem,6vw,3.4rem);font-weight:600;text-shadow:0 2px 18px rgba(0,0,0,.35)}
.hero-copy p{margin-top:8px;font-size:1.02rem;color:#f3e6c8;max-width:560px;text-shadow:0 1px 10px rgba(0,0,0,.4)}
.rate-card{margin-top:-58px;position:relative;z-index:5;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:22px 22px 18px}
.rate-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px}
.rate-head h2{font-size:1.5rem}
.rate-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.rate-cell{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 14px;text-align:center}
.rate-cell .purity{font-size:.78rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--bronze)}
.rate-cell .big{font-family:'Fraunces',serif;font-size:clamp(1.35rem,4.5vw,1.9rem);font-weight:700;margin:4px 0 2px}
.rate-cell .per{font-size:.85rem;color:var(--ink2)}
.rate-cell.hl{border:2px solid var(--bronze);background:linear-gradient(180deg,#fffaf0,#fdf3d7)}
.chg{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.9rem;padding:5px 12px;border-radius:99px;background:#fdeceb;color:var(--bad)}
.chg.down svg{transform:rotate(0deg)}
.rate-foot{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:14px;font-size:.86rem;color:var(--ink2)}
.rate-foot b{color:var(--ink)}
/* ---------- chart + verdict ---------- */
section{padding:34px 0 6px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px;margin-bottom:14px}
.sec-head h2{font-size:1.6rem}
.split{display:grid;grid-template-columns:1.25fr .9fr;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow2);padding:20px}
.chart-wrap{position:relative;height:220px}
.chart-wrap canvas{width:100%;height:100%}
.chart-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stat .v{font-family:'Fraunces',serif;font-size:1.25rem;font-weight:700}
.stat .k{font-size:.78rem;color:var(--ink2);font-weight:600}
.verdict{background:linear-gradient(160deg,#2b1d12,#4a3319);color:#f7ead0;border-radius:var(--r);padding:22px;box-shadow:var(--shadow)}
.verdict h3{font-size:1.35rem;color:#ffe9a8}
.verdict .call{font-size:1.05rem;margin:10px 0 6px;line-height:1.5}
.verdict ul{margin:12px 0 0 18px;font-size:.92rem;color:#e8d9b8}
.verdict ul li{margin:6px 0}
.verdict .fine{margin-top:14px;font-size:.8rem;color:#c9b48c}
.pill{display:inline-block;padding:4px 11px;border-radius:99px;font-size:.78rem;font-weight:700}
.pill.gold{background:var(--amberbg);color:#7a5c00;border:1px solid #e8c96a}
.pill.red{background:#fdeceb;color:var(--bad)}
/* ---------- calculator + receipt ---------- */
.calc-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field{margin-bottom:16px}
.field label{display:block;font-size:.85rem;font-weight:700;margin-bottom:6px}
.field label .hint{font-weight:500;color:var(--ink2)}
.field input[type=number],.field select{width:100%;padding:11px 12px;border:1.5px solid var(--line2);border-radius:12px;background:#fff;font-size:1rem}
.field input[type=number]:focus,.field select:focus{outline:2px solid var(--bronze);outline-offset:1px;border-color:var(--bronze)}
input[type=range]{width:100%;accent-color:var(--bronze)}
.range-val{font-weight:800;color:var(--terra)}
.preset-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.preset{border:1.5px solid var(--line2);background:#fff;border-radius:99px;padding:7px 14px;font-size:.86rem;font-weight:600}
.preset.on{background:var(--ink);color:#f7ead0;border-color:var(--ink)}
.receipt{background:#fffaf0;border:1.5px dashed var(--bronze);border-radius:var(--r);padding:20px}
.receipt h3{font-size:1.2rem;text-align:center}
.receipt .rdate{text-align:center;font-size:.82rem;color:var(--ink2);margin:2px 0 12px}
.rrow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.rrow span:first-child{color:var(--ink2)}
.rrow.total{border-bottom:none;border-top:2px solid var(--ink);margin-top:6px;padding-top:12px;font-size:1.1rem}
.rrow.total b{font-family:'Fraunces',serif;font-size:1.35rem}
.rnote{font-size:.82rem;color:var(--ink2);margin-top:10px}
.btn{display:inline-block;border:none;border-radius:12px;padding:12px 20px;font-weight:700;font-size:.95rem;background:var(--ink);color:#f7ead0}
.btn:hover{background:#3d2a18}
.btn.ghost{background:transparent;border:1.5px solid var(--line2);color:var(--ink)}
.btn.terra{background:var(--terra);color:#fff}
.btn.small{padding:8px 14px;font-size:.86rem;border-radius:10px}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.quote{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:10px;background:var(--paper)}
.quote.best{border:2px solid var(--good);background:#f2f8f2}
.quote .qtop{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.quote .qname{font-weight:700}
.quote .qtotal{font-family:'Fraunces',serif;font-size:1.2rem;font-weight:700}
.quote .qmeta{font-size:.85rem;color:var(--ink2);margin-top:2px}
/* ---------- stash ---------- */
.stash-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.stash-strip .stat .v.good{color:var(--good)}
.stash-item{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:10px;background:var(--paper)}
.stash-item .sname{font-weight:700}
.stash-item .smeta{font-size:.85rem;color:var(--ink2)}
.stash-item .sval{text-align:right}
.stash-item .sval .now{font-family:'Fraunces',serif;font-weight:700;font-size:1.1rem}
.stash-item .sval .gain{font-size:.85rem;font-weight:700}
.gain.up{color:var(--good)}.gain.down{color:var(--bad)}
.stash-form{display:grid;grid-template-columns:1.4fr .7fr .8fr .9fr;gap:10px;margin-top:14px}
.stash-form input,.stash-form select{padding:10px 12px;border:1.5px solid var(--line2);border-radius:12px;background:#fff;width:100%}
.icon-btn{background:none;border:none;color:var(--ink3);font-size:1.05rem;padding:4px 8px;border-radius:8px}
.icon-btn:hover{background:var(--paper2);color:var(--bad)}
/* ---------- hallmark / compare / checklist / guides ---------- */
.purity-table{width:100%;border-collapse:collapse;font-size:.92rem;margin-top:6px}
.purity-table th,.purity-table td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left}
.purity-table th{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.purity-table tr:last-child td{border-bottom:none}
.huid{display:flex;gap:12px;align-items:flex-start;background:var(--amberbg);border:1px solid #ecd28a;border-radius:14px;padding:14px;margin-top:14px}
.huid .ic{flex:none;width:38px;height:38px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;border:1px solid #ecd28a}
.cmp{width:100%;border-collapse:collapse;font-size:.9rem}
.cmp th,.cmp td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.cmp th{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.cmp tr:last-child td{border-bottom:none}
.cmp td:first-child{font-weight:700}
.check-item{display:flex;gap:12px;align-items:flex-start;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.check-item:last-child{border-bottom:none}
.check-box{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--bronze);margin-top:2px;display:flex;align-items:center;justify-content:center;background:#fff}
.check-item.done .check-box{background:var(--bronze);border-color:var(--bronze)}
.check-item.done .check-box svg{opacity:1}
.check-box svg{opacity:0;width:14px;height:14px}
.check-item.done .check-txt{color:var(--ink3);text-decoration:line-through}
.check-txt b{display:block;font-size:.96rem}
.check-txt span{font-size:.85rem;color:var(--ink2)}
.ring-wrap{display:flex;align-items:center;gap:14px}
.ring{position:relative;width:74px;height:74px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .ring-txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.95rem}
.guide{border:1px solid var(--line);border-radius:14px;margin-top:10px;background:var(--paper);overflow:hidden}
.guide-head{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;background:none;border:none;text-align:left;padding:15px 16px;font-weight:700;font-size:.98rem;color:var(--ink)}
.guide-head .chev{transition:transform .25s;flex:none;color:var(--bronze)}
.guide.open .guide-head .chev{transform:rotate(180deg)}
.guide-body{display:none;padding:0 16px 16px;font-size:.93rem;color:var(--ink2)}
.guide.open .guide-body{display:block}
.guide-body p{margin:6px 0}
/* ---------- photo band / footer / coach ---------- */
.band{margin:38px 0 6px;border-radius:var(--r);overflow:hidden;position:relative;height:230px}
.band img{width:100%;height:100%;object-fit:cover;animation:kenburns 30s ease-in-out infinite alternate}
.band::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(43,29,18,.72),rgba(43,29,18,.15))}
.band-txt{position:absolute;left:24px;bottom:22px;color:#fff8ea;max-width:520px}
.band-txt h3{font-size:1.5rem}
.band-txt p{font-size:.93rem;color:#f3e6c8;margin-top:4px}
footer.site{margin-top:44px;border-top:1px solid var(--line);padding:26px 0 40px;background:var(--paper2)}
.foot-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:20px}
.disclaimer{font-size:.8rem;color:var(--ink2);margin-top:16px}
#coach{position:fixed;inset:0;z-index:150;background:rgba(43,29,18,.55);display:none;align-items:flex-end;justify-content:center;padding:18px}
#coach.show{display:flex}
.coach-card{background:var(--card);border-radius:20px;max-width:460px;width:100%;padding:24px;box-shadow:var(--shadow);animation:slideup .35s ease}
@keyframes slideup{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
.coach-card h3{font-size:1.3rem;margin:6px 0}
.coach-dots{display:flex;gap:6px;margin-top:16px}
.coach-dots i{width:22px;height:5px;border-radius:99px;background:var(--line2)}
.coach-dots i.on{background:var(--bronze)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#f7ead0;padding:11px 20px;border-radius:99px;font-size:.9rem;font-weight:600;z-index:180;transition:transform .3s ease;box-shadow:var(--shadow)}
.toast.show{transform:translateX(-50%) translateY(0)}
@media(max-width:760px){
  .split,.calc-grid,.foot-grid{grid-template-columns:1fr}
  .rate-grid{grid-template-columns:1fr 1fr}
  .rate-cell:last-child{grid-column:1/-1}
  .stash-strip{grid-template-columns:1fr 1fr}
  .stash-form{grid-template-columns:1fr 1fr}
  .hero-photo{height:260px}
  .chart-stats{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<!-- INTRO -->
<div id="intro" role="dialog" aria-label="Welcome">
  <div class="coin" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="#5c4300" stroke-width="1.6"/><text x="12" y="16" text-anchor="middle" font-size="11" font-weight="800" fill="#5c4300" font-family="Georgia,serif">&#8377;</text></svg>
  </div>
  <h1 aria-label="GoldKit"><span>G</span><span>o</span><span>l</span><span>d</span><span>K</span><span>i</span><span>t</span></h1>
  <p>Buy gold like someone who knows the price — the rate, the making charges, the hallmark, all of it.</p>
  <div id="introBarWrap"><div id="introBar"></div></div>
  <button id="introSkip" type="button">Skip intro</button>
</div>

<!-- HEADER -->
<header class="site">
  <div class="site-in">
    <div class="logo"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="#5c4300" stroke-width="1.6"/><text x="12" y="16" text-anchor="middle" font-size="11" font-weight="800" fill="#5c4300" font-family="Georgia,serif">&#8377;</text></svg></span>GoldKit</div>
    <div class="hdr-right">
      <span class="chip"><span class="dot"></span>Rates · 22 Nov 2026</span>
      <span class="chip" id="hdrDate">Sun 22 Nov</span>
    </div>
  </div>
</header>

<!-- TICKER -->
<div class="ticker" aria-hidden="true"><div class="ticker-track" id="tickerTrack"></div></div>
<!-- @@NEXT@@ -->
